
- kind: Project
  projectType: 1
  metadata:
    name: Ethereum SubQuery Data Node
    description: |
      # Introduction
      **SubQuery Data Node** is an enhanced Ethereum node with extra subql_ rpcs.
      
      These rpcs are optimised for querying, similar to `eth_getLogs` but more powerful, provides the ability to filter transactions in a single API call.
      
      It builds on the Geth client, any geth node can switch to SubQuery Data Node by replacing the geth binary to data node's.
      
      Working together, the SubQuery Indexer and SubQuery Data Node will provide the most performant indexing performance possible and in a completely decentralised way thanks to the SubQuery Network. Our node runners will be able to run these data nodes on the network, bringing powerful and cost-effective RPC access to all, cementing SubQuery’s position as the fastest decentralised data indexer in web3.
      
      # Compatibility
        The SubQuery Data Node is forked from the Geth client and is compatible with the Ethereum network.

    websiteUrl: https://subquery.network
    codeUrl: https://github.com/subquery/data-node-go-ethereum
    image: QmNmQW36bJrwTAokXDy9dQXECGMCMAZckyv1zs97AuyQPT
  deployments:
    - deployment: |
        kind: ChainRpc
        specVersion: "1.0.0"
        chain:
          chainId: 1
        rpcFamily:
          - subql_dict
        rpcAllowList:
          - subql_
        computeUnit:
          - name: subql_filterBlocksCapabilities
            value: 1
          - name: subql_filterBlocks
            value: 10
          - name: '*'
            value: 1
      version:
        version: 1.0.0
        description: |
          # Run SubQuery Data Node
          * Have a fully synced Geth node running, it doesn't matter whether the node is full or archive.
          * Change the geth binary to the data node's binary. 
            - If your node is running in docker, you can use the `subquerynetwork/data-node-go-ethereum` image.
            - If your node is running in a local machine, you can download the binary from the [releases page](https://github.com/subquery/data-node-go-ethereum/releases)


