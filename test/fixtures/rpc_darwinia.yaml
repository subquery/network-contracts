- kind: Project
  projectType: 1 # rpc
  metadata:
      name: Darwinia RPC - Archive Node
      description: |
        **Public RPC endpoint**: coming soon
        
        Connect in seconds to SubQuery's decentralised network of RPC node operators running around the world so your dApps benefit from more reliable, scalable, and affordable RPC services. By accessing this public RPC endpoint, you agree to our [Free Public RPC terms of service](https://subquery.foundation/public-rpc-terms).
      websiteUrl: https://darwinia.network/
      codeUrl: https://github.com/darwinia-network
      image: QmSGczmXpvUh8FqsegQ72EZpfpUsJf3H2gQq4i3Qt2M8Be
  deployments:
      - deployment: |
            kind: ChainRpc
            specVersion: "1.0.0"
            chain:
              genesisHash: 0xf0b8924b12e8108550d28870bc03f7b45a947e1b2b9abf81bfb0b89ecb60570e
            rpcFamily:
              - polkadot
            nodeType: archive
            rpcDenyList:
              - author_hasKey
              - author_hasSessionKeys
              - author_insertKey
              - author_removeExtrinsic
              - author_rotateKeys
              - babe_
              - dev_
              - engine_
              - offchain_
              - state_getPairs
              - state_queryStorage
              - state_traceBlock
              - state_trieMigrationStatus
              - system_addLogFilter
              - system_addReservedPeer
              - system_dryRun
              - system_networkState
              - system_peers
              - system_removeReservedPeer
              - system_resetLogFilter

        version:
            version: 1.0.0
            description: |
              use latest subquerynetwork/indexer-coordinator (>= v2.1.0)
